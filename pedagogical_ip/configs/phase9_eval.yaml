# Phase 9 Evaluation Matrix Configuration
#
# Agent × Teacher × Environment grid for paper experiments.
# Teacher conditions explicitly restrict allowed_interventions.

agent_levels:
  weak:
    search_budget: 4
    lambda_risk: 1.0
    lambda_uncertainty: 0.1
  medium:
    search_budget: 16
    lambda_risk: 3.0
    lambda_uncertainty: 0.3
  strong:
    search_budget: 30
    lambda_risk: 5.0
    lambda_uncertainty: 0.5

teacher_conditions:
  no_tutor:
    tutor_mode: "none"
    warning_mode: "none"
    robot_belief_mode: false
    allowed_interventions: [WAIT]
  warning_only:
    tutor_mode: "none"
    warning_mode: "fixed"
    lambda_lane_warn: 5.0
    robot_belief_mode: false
    allowed_interventions: [WAIT, WARN]
  unlock_only:
    tutor_mode: "time_aware"
    closure_budget: 3
    robot_belief_mode: false
    allowed_interventions: [WAIT, UNLOCK]
  item_only:
    tutor_mode: "none"
    robot_belief_mode: true
    intervention_family_mode: true
    item_drop_enabled: true
    allowed_interventions: [WAIT, ITEM_DROP]
  heuristic_mixed:
    tutor_mode: "warn_first"
    robot_belief_mode: false
    allowed_interventions: [WAIT, WARN, UNLOCK]
  robot_belief:
    tutor_mode: "none"
    robot_belief_mode: true
    intervention_family_mode: true
    item_drop_enabled: true
    prefix_horizon: 5
    allowed_interventions: [WAIT, WARN, UNLOCK, ITEM_DROP]

env_conditions:
  easy:
    difficulty: "easy"
  medium:
    difficulty: "medium"
  hard:
    difficulty: "hard"

scenario_families:
  - baseline_v2
  - fork_trap
  - hazard_belt
  - deadline_gate
  - delayed_corridor
  - distractor_cue

evaluation:
  n_train_episodes: 20
  n_transfer_episodes: 10
  seeds_start: 0
  latent_mode: true
  output_dir: "output/phase9"

smoke:
  n_train_episodes: 3
  n_transfer_episodes: 2
  agent_levels: [medium]
  teacher_conditions: [no_tutor, warning_only, robot_belief]
  env_conditions: [medium]
  scenario_families: [baseline_v2, fork_trap, hazard_belt, deadline_gate]
