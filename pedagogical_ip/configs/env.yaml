# Environment configuration
grid:
  height: 8
  width: 8

terrain:
  default_cost: 1.0
  high_cost_value: 5.0
  risky_penalty: 10.0         # penalty if risk event triggers
  risk_trigger_prob: 0.3      # prob of risk event on a risky cell (no shield)
  risk_trigger_prob_shield: 0.02  # prob of risk event with shield

episode:
  max_steps: 60
  initial_risk_budget: 1.0    # cumulative risk budget before "death"
  shield_duration: 5          # steps a dropped shield lasts
